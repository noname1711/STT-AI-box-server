[workspace]
members = [
  "crates/stt-core",
  "crates/stt-capu",
  "crates/stt-http",
  "crates/stt-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "LicenseRef-VietInnotech-Proprietary"
authors = ["VietInnotech"]
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1.10"
bzip2 = "0.5"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sherpa-onnx = "1.13.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3.15"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.44", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
