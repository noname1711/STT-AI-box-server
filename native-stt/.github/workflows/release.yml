name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            artifact_name: vit-stt-macos-arm64.tar.gz
            asset_type: tar
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: vit-stt-windows-x86_64.zip
            asset_type: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Python for CAPU worker
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install CAPU worker build dependencies
        run: python -m pip install --upgrade pip pyinstaller -e capu-worker

      - name: Build packaged CAPU worker
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name vit-stt-capu-worker-full-numpy \
            --paths capu-worker \
            --hidden-import difflib \
            --hidden-import filelock \
            --hidden-import numpy \
            --hidden-import torch \
            --hidden-import transformers \
            --hidden-import sentencepiece \
            --collect-all numpy \
            --collect-all torch \
            --collect-all transformers \
            --collect-all tokenizers \
            --collect-all sentencepiece \
            --distpath capu-dist \
            --workpath capu-build \
            --specpath capu-spec \
            capu-worker/scripts/capu_worker_entry.py

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Package release layout
        shell: bash
        run: |
          export VIT_STT_INCLUDE_MODELS=0
          export VIT_STT_RELEASE_BIN_DIR="target/${{ matrix.rust_target }}/release"
          export VIT_STT_CAPU_WORKER_SRC="$PWD/capu-dist/vit-stt-capu-worker-full-numpy"
          ./scripts/package-release stt-staged

      - name: Smoke packaged CLI
        shell: bash
        run: |
          if [[ -x stt-staged/bin/stt-cli.exe ]]; then
            stt-staged/bin/stt-cli.exe --help
            stt-staged/bin/stt-cli.exe list-models
          else
            stt-staged/bin/stt-cli --help
            stt-staged/bin/stt-cli list-models
          fi

      - name: Compress artifact (Tarball)
        if: matrix.asset_type == 'tar'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C stt-staged .

      - name: Compress artifact (Zip)
        if: matrix.asset_type == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path stt-staged\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload artifact to job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Stage release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          ls -lh dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
