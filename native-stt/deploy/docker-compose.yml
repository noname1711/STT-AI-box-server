version: '3.8'

services:
  vit-stt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Optional: Mount a local models folder so you don't need to re-download on every docker restart/rebuild
      - stt-models:/app/models
    environment:
      - VIT_STT_SERVER_HOST=0.0.0.0
      - VIT_STT_SERVER_PORT=8080
      - LLAMA_SERVER_URL=http://llama-server:8001
    depends_on:
      - llama-server
    restart: always

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    # Run llama-server with default project parameters using Gemma GGUF model
    command: -hf unsloth/gemma-4-E4B-it-GGUF --temp 0.3 --top-p 0.95 --top-k 64 --reasoning off -c 32768 --host 0.0.0.0 --port 8001 --alias vit_small_4b
    ports:
      - "8001:8001"
    volumes:
      # Cache huggingface downloads so they persist across restarts
      - llama-cache:/root/.cache/huggingface
    restart: always

volumes:
  stt-models:
  llama-cache:
